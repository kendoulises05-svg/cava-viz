## Config de cava para la terminal (Konsole). Uso:
##   cava -p ~/.config/cava/terminal.conf
## El puente reescribe gradient_color_1..4 con el color más vivo del wallpaper
## (al cambiar de wallpaper y al abrir este cava). No borres esas cuatro líneas.

[general]
framerate = 60
# 0 = tantas barras como quepan en la terminal
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = noncurses
channels = stereo

[color]
gradient = 1
gradient_color_1 = '#2E1A0F'
gradient_color_2 = '#73411F'
gradient_color_3 = '#CC7333'
gradient_color_4 = '#FFD9B8'

[smoothing]
noise_reduction = 30
